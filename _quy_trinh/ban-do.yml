# Tầng 0 — bản đồ tổng. Làn dọc là phân khu, thời gian chạy từ trên xuống.
#
# o:      id của ô
# lan:    phân khu (A..E)        hang: số hàng, tính từ 0
# kieu:   buoc | re | cong       (cong = ô trỏ sang nơi khác, viền đứt)
# den:    nơi mở khi bấm — {phan_khu, buoc} và `tam` cho phân khu chưa dựng
# canh_bao: true thì gắn dấu ⚠ (bước có tình huống rẽ nhánh)
#
# Đường nối: tu → toi, ra/vao là cạnh của ô (tren, duoi, trai, phai).
# lech_ra / lech_vao dịch điểm ra/vào theo chiều ngang để hai đường không chạm nhau.
# qua: {lan, canh: trai|phai, lech} — đoạn dọc đi riêng, tính theo mép làn.

tieu_de: Bản đồ tổng của quy trình hợp nhất
mo_ta: >-
  Năm làn dọc là năm phân khu: bán hàng, điều phối và hiện trường, kho và giao nhận,
  thu tiền và kế toán, sau bán hàng. Luồng chính chạy từ tiếp nhận khách hàng, lập đơn,
  điều phối, cấp vật tư, làm việc tại nhà khách, giao hàng, thu tiền, nộp tiền, hoá đơn,
  rồi sang nhắc bảo dưỡng; khách đồng ý thì quay lại lập đơn mới. Sự cố là đầu vào thứ hai,
  cần đến tận nơi thì đi vào điều phối.

