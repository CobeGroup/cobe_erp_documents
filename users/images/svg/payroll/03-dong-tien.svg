<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Dòng tiền một phiếu lương — thu nhập trừ khấu trừ ra thực lãnh</title>
  <desc>Phiếu 07/2026 của Lê Thị Hồng Demo: tổng thu nhập 32.690.800, khấu trừ 5.584.000, thực lãnh 27.106.800.</desc>
  <defs>
    <style>
      .h    { font-size: 14px; font-weight: 700; }
      .r    { font-size: 13px; fill: #3e4c59; }
      .rn   { font-size: 13px; fill: #26323d; font-weight: 600; }
      .note { font-size: 11px; fill: #7b8794; }
      .tot  { font-size: 14px; font-weight: 700; }
      .big  { font-size: 20px; font-weight: 700; }
      .s    { font-size: 11.5px; fill: #5b6b78; }
    </style>
  </defs>
  <rect width="980" height="500" fill="#ffffff"/>

  <!-- ===== CỘNG ===== -->
  <rect x="40" y="24" width="430" height="270" rx="9" fill="#f6fcf8" stroke="#a8d9bd"/>
  <rect x="40" y="24" width="430" height="30" rx="9" fill="#34a36a"/>
  <rect x="40" y="44" width="430" height="10" fill="#34a36a"/>
  <text x="56" y="44" class="h" fill="#ffffff">CỘNG — Thu nhập (Earnings)</text>

  <text x="56" y="78" class="r">Lương cơ bản  <tspan class="note">30.000.000 × 24/25</tspan></text>
  <text x="454" y="78" class="rn" text-anchor="end">28.800.000</text>

  <text x="56" y="104" class="r">Phụ cấp ăn trưa  <tspan class="note">730.000 × 24/25 · miễn thuế</tspan></text>
  <text x="454" y="104" class="rn" text-anchor="end">700.800</text>

  <text x="56" y="130" class="r">Phụ cấp điện thoại  <tspan class="note">khoán, không prorate</tspan></text>
  <text x="454" y="130" class="rn" text-anchor="end">300.000</text>

  <text x="56" y="156" class="r">Phụ cấp xăng xe  <tspan class="note">500.000 × 24/25</tspan></text>
  <text x="454" y="156" class="rn" text-anchor="end">480.000</text>

  <text x="56" y="182" class="r">Phụ cấp trách nhiệm  <tspan class="note">1.000.000 × 24/25</tspan></text>
  <text x="454" y="182" class="rn" text-anchor="end">960.000</text>

  <text x="56" y="208" class="r">Thưởng  <tspan class="note">Additional Salary</tspan></text>
  <text x="454" y="208" class="rn" text-anchor="end">1.000.000</text>

  <text x="56" y="234" class="r">Lương làm thêm giờ  <tspan class="note">2h × ×1,5 · Overtime Slip</tspan></text>
  <text x="454" y="234" class="rn" text-anchor="end">450.000</text>

  <line x1="56" y1="250" x2="454" y2="250" stroke="#a8d9bd"/>
  <text x="56" y="274" class="tot" fill="#12502f">TỔNG THU NHẬP</text>
  <text x="454" y="274" class="tot" fill="#12502f" text-anchor="end">32.690.800</text>

  <!-- ===== TRỪ ===== -->
  <rect x="510" y="24" width="430" height="270" rx="9" fill="#fff6f5" stroke="#e8a49d"/>
  <rect x="510" y="24" width="430" height="30" rx="9" fill="#d95c52"/>
  <rect x="510" y="44" width="430" height="10" fill="#d95c52"/>
  <text x="526" y="44" class="h" fill="#ffffff">TRỪ — Khấu trừ (Deductions)</text>

  <text x="526" y="78" class="r">BHXH  <tspan class="note">8% × 30.000.000 (mức đóng BH)</tspan></text>
  <text x="924" y="78" class="rn" text-anchor="end">2.400.000</text>

  <text x="526" y="104" class="r">BHYT  <tspan class="note">1,5%</tspan></text>
  <text x="924" y="104" class="rn" text-anchor="end">450.000</text>

  <text x="526" y="130" class="r">BHTN  <tspan class="note">1%</tspan></text>
  <text x="924" y="130" class="rn" text-anchor="end">300.000</text>

  <text x="526" y="156" class="r">Thuế TNCN  <tspan class="note">luỹ tiến theo tháng — xem sơ đồ dưới</tspan></text>
  <text x="924" y="156" class="rn" text-anchor="end">434.000</text>

  <text x="526" y="182" class="r">Tạm ứng  <tspan class="note">Additional Salary (khấu trừ)</tspan></text>
  <text x="924" y="182" class="rn" text-anchor="end">2.000.000</text>

  <text x="526" y="216" class="s">BH tính trên “Mức lương đóng BH” (trống = Base),</text>
  <text x="526" y="234" class="s">có trần 20× lương cơ sở; dưới 14 công thì tháng đó không trích.</text>

  <line x1="526" y1="250" x2="924" y2="250" stroke="#e8a49d"/>
  <text x="526" y="274" class="tot" fill="#7a1f18">TỔNG KHẤU TRỪ</text>
  <text x="924" y="274" class="tot" fill="#7a1f18" text-anchor="end">5.584.000</text>

  <!-- ===== thanh tỉ lệ ===== -->
  <text x="40" y="330" class="s">Tổng thu nhập 32.690.800 đ chia ra:</text>
  <g>
    <rect x="40" y="342" width="713" height="34" fill="#34a36a"/>
    <rect x="753" y="342" width="83" height="34" fill="#d95c52"/>
    <rect x="836" y="342" width="11" height="34" fill="#a8382e"/>
    <rect x="847" y="342" width="53" height="34" fill="#e8a49d"/>
    <rect x="40" y="342" width="860" height="34" fill="none" stroke="#ffffff" stroke-width="0"/>
    <text x="56" y="365" fill="#ffffff" class="h">Thực lãnh 27.106.800 đ  (82,9%)</text>
  </g>
  <line x1="794" y1="378" x2="794" y2="392" stroke="#7b8794"/>
  <text x="794" y="406" class="s" text-anchor="middle">BH 3,15tr</text>
  <line x1="841" y1="378" x2="841" y2="410" stroke="#7b8794"/>
  <text x="841" y="424" class="s" text-anchor="middle">thuế 434k</text>
  <line x1="873" y1="378" x2="873" y2="392" stroke="#7b8794"/>
  <text x="873" y="406" class="s" text-anchor="middle">tạm ứng 2tr</text>

  <!-- ===== kết quả ===== -->
  <rect x="40" y="440" width="900" height="46" rx="9" fill="#eefaf2" stroke="#34a36a" stroke-width="2"/>
  <text x="56" y="470" class="big" fill="#12502f">THỰC LÃNH = 32.690.800 − 5.584.000 = 27.106.800 đ</text>
</svg>
