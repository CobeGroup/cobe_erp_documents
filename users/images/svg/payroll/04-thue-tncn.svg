<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Thuế TNCN luỹ tiến từng phần theo tháng</title>
  <desc>Từ thu nhập chịu thuế 31.690.000 trừ bảo hiểm và giảm trừ gia cảnh còn 6.840.000, áp 2 bậc đầu ra 434.000 đồng.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
    <style>
      .h   { font-size: 14px; font-weight: 700; }
      .r   { font-size: 13px; fill: #3e4c59; }
      .n   { font-size: 13px; font-weight: 600; fill: #26323d; }
      .s   { font-size: 11.5px; fill: #7b8794; }
      .k   { font-size: 15px; font-weight: 700; }
      .th  { font-size: 11.5px; font-weight: 700; fill: #5b6b78; }
      .td  { font-size: 12px; fill: #3e4c59; }
    </style>
  </defs>
  <rect width="980" height="470" fill="#ffffff"/>

  <!-- ===== trái: rút gọn về thu nhập tính thuế ===== -->
  <text x="40" y="30" class="h" fill="#26323d">① Từ thu nhập → thu nhập TÍNH THUẾ</text>

  <rect x="40" y="44" width="430" height="52" rx="8" fill="#f6fcf8" stroke="#a8d9bd"/>
  <text x="56" y="66" class="r">Tổng earning <tspan font-weight="700">chịu thuế</tspan></text>
  <text x="454" y="66" class="n" text-anchor="end">31.690.000</text>
  <text x="56" y="86" class="s">lương CB + xăng xe + trách nhiệm + thưởng + OT (đã prorate)</text>

  <rect x="40" y="106" width="430" height="34" rx="8" fill="#fff6f5" stroke="#e8a49d"/>
  <text x="56" y="128" class="r">− Bảo hiểm bắt buộc đã đóng</text>
  <text x="454" y="128" class="n" text-anchor="end">3.150.000</text>

  <rect x="40" y="150" width="430" height="34" rx="8" fill="#f2f8fd" stroke="#9fc9e6"/>
  <text x="56" y="172" class="r">− Giảm trừ bản thân</text>
  <text x="454" y="172" class="n" text-anchor="end">15.500.000</text>

  <rect x="40" y="194" width="430" height="34" rx="8" fill="#f2f8fd" stroke="#9fc9e6"/>
  <text x="56" y="216" class="r">− Giảm trừ 1 người phụ thuộc  <tspan class="s">(6,2tr × 1)</tspan></text>
  <text x="454" y="216" class="n" text-anchor="end">6.200.000</text>

  <line x1="40" y1="242" x2="470" y2="242" stroke="#cbd2d9"/>
  <rect x="40" y="252" width="430" height="44" rx="8" fill="#fffbe6" stroke="#e0c341" stroke-width="2"/>
  <text x="56" y="280" class="k" fill="#6b5300">= Thu nhập tính thuế 6.840.000</text>

  <text x="40" y="326" class="s">Ăn trưa (700.800) và điện thoại (300.000) <tspan font-weight="700" fill="#3e4c59">không</tspan> vào thu nhập chịu thuế —</text>
  <text x="40" y="344" class="s">2 khoản này khai <tspan font-family="monospace">is_tax_applicable = 0</tspan> (miễn thuế trong hạn mức).</text>

  <text x="40" y="380" class="s">Số này &lt; 0 thì thuế = 0 — lương dưới ~19tr, độc thân, thường chưa tới ngưỡng.</text>

  <!-- mũi tên sang phải -->
  <line x1="474" y1="274" x2="506" y2="274" stroke="#7b8794" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- ===== phải: biểu thuế luỹ tiến ===== -->
  <text x="510" y="30" class="h" fill="#26323d">② Áp biểu thuế luỹ tiến TỪNG PHẦN</text>

  <!-- thanh minh hoạ -->
  <rect x="510" y="44" width="180" height="30" fill="#f5d76e" stroke="#e0c341"/>
  <rect x="690" y="44" width="66" height="30" fill="#f0b429" stroke="#d99e1f"/>
  <rect x="756" y="44" width="184" height="30" fill="#f4f6f8" stroke="#dfe3e8"/>
  <text x="600" y="64" class="td" text-anchor="middle" fill="#5c4708">5.000.000 × 5%</text>
  <text x="723" y="64" class="td" text-anchor="middle" fill="#5c4708">×10%</text>
  <text x="848" y="64" class="td" text-anchor="middle" fill="#9aa5b1">chưa chạm tới</text>
  <line x1="756" y1="78" x2="756" y2="92" stroke="#7b8794"/>
  <text x="756" y="106" class="s" text-anchor="middle">6.840.000 dừng ở đây</text>

  <!-- bảng bậc -->
  <text x="510" y="134" class="th">BẬC (thu nhập tính thuế / tháng)</text>
  <text x="940" y="134" class="th" text-anchor="end">THUẾ SUẤT</text>
  <line x1="510" y1="140" x2="940" y2="140" stroke="#cbd2d9"/>

  <rect x="510" y="144" width="430" height="26" fill="#fffbe6"/>
  <text x="518" y="162" class="td">1 · đến 5.000.000</text>
  <text x="932" y="162" class="td" text-anchor="end" font-weight="700">5%</text>

  <rect x="510" y="170" width="430" height="26" fill="#fffbe6"/>
  <text x="518" y="188" class="td">2 · 5.000.000 → 10.000.000</text>
  <text x="932" y="188" class="td" text-anchor="end" font-weight="700">10%</text>

  <text x="518" y="214" class="td" fill="#9aa5b1">3 · 10.000.000 → 18.000.000</text>
  <text x="932" y="214" class="td" text-anchor="end" fill="#9aa5b1">15%</text>
  <text x="518" y="238" class="td" fill="#9aa5b1">4 · 18.000.000 → 32.000.000</text>
  <text x="932" y="238" class="td" text-anchor="end" fill="#9aa5b1">20%</text>
  <text x="518" y="262" class="td" fill="#9aa5b1">5 · 32.000.000 → 52.000.000</text>
  <text x="932" y="262" class="td" text-anchor="end" fill="#9aa5b1">25%</text>
  <text x="518" y="286" class="td" fill="#9aa5b1">6 · 52.000.000 → 80.000.000</text>
  <text x="932" y="286" class="td" text-anchor="end" fill="#9aa5b1">30%</text>
  <text x="518" y="310" class="td" fill="#9aa5b1">7 · trên 80.000.000</text>
  <text x="932" y="310" class="td" text-anchor="end" fill="#9aa5b1">35%</text>

  <!-- phép tính -->
  <rect x="510" y="326" width="430" height="94" rx="8" fill="#fff6f5" stroke="#e8a49d"/>
  <text x="526" y="350" class="r">Bậc 1: 5.000.000 × 5%</text>
  <text x="924" y="350" class="n" text-anchor="end">250.000</text>
  <text x="526" y="374" class="r">Bậc 2: 1.840.000 × 10%</text>
  <text x="924" y="374" class="n" text-anchor="end">184.000</text>
  <line x1="526" y1="386" x2="924" y2="386" stroke="#e8a49d"/>
  <text x="526" y="410" class="k" fill="#7a1f18">THUẾ TNCN</text>
  <text x="924" y="410" class="k" fill="#7a1f18" text-anchor="end">434.000</text>

  <text x="510" y="444" class="s">Tỷ lệ BH, giảm trừ và 7 bậc thuế khai ở <tspan font-weight="700" fill="#3e4c59">Cobe Payroll Policy</tspan> — mỗi bản một</text>
  <text x="510" y="462" class="s"><tspan font-weight="700" fill="#3e4c59">ngày hiệu lực</tspan>; phiếu tra theo ngày đầu kỳ nên tháng cũ luôn ra đúng luật tháng đó.</text>
</svg>
