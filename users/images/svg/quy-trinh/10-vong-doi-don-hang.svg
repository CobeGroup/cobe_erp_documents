  <a href="../../../Quy-Trinh-B-Hien-Truong.html#lap-sa" target="_top"><title>Lập lịch hẹn</title><rect class="hot" x="108" y="270" width="352" height="78" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-C-Kho-Giao-Nhan.html#yeu-cau" target="_top"><title>Xuất vật tư</title><rect class="hot" x="108" y="374" width="352" height="78" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-B-Hien-Truong.html#hien-truong" target="_top"><title>Làm việc tại hiện trường</title><rect class="hot" x="108" y="478" width="352" height="78" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-C-Kho-Giao-Nhan.html#giao-hang" target="_top"><title>Lập phiếu giao hàng</title><rect class="hot" x="108" y="582" width="352" height="78" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-D-Thu-Tien.html#tien-mat" target="_top"><title>Thu tiền mặt</title><rect class="hot" x="108" y="686" width="352" height="78" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-D-Thu-Tien.html#tien-mat" target="_top"><title>Nộp tiền về công ty</title><rect class="hot" x="108" y="790" width="352" height="78" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-D-Thu-Tien.html#chuyen-khoan" target="_top"><title>Thu phần chuyển khoản</title><rect class="hot" x="108" y="894" width="352" height="78" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-D-Thu-Tien.html#hoa-don" target="_top"><title>Hoá đơn và lịch bảo dưỡng</title><rect class="hot" x="108" y="998" width="352" height="78" rx="10" ry="10"/></a>
  <!-- /VUNG-BAM -->
</svg>
