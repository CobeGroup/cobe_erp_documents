<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Vòng đời đơn bán hàng</title>
  <desc>Đơn bán hàng đi từ Nháp, qua xác nhận thành Chờ giao và chờ hoá đơn, rồi Chờ nốt phần còn lại, cuối cùng là Hoàn tất. Ba nhánh rẽ là Tạm giữ, Đóng đơn và Đã huỷ; đơn đã huỷ lập lại được bằng bản sửa lại.</desc>
  <style>
    .box  { rx: 11; ry: 11; stroke-width: 1.6; }
    .draft{ fill: #fafafa; stroke: #bfbfbf; }
    .run  { fill: #e6f4ff; stroke: #299dd8; }
    .fin  { fill: #f6ffed; stroke: #54ab78; }
    .hold { fill: #fffbe6; stroke: #d4b106; }
    .bad  { fill: #fff1f0; stroke: #ff4d4f; }
    .tb   { font-size: 13.5px; font-weight: 600; fill: #111827; }
    .ts   { font-size: 11.5px; fill: #4b5563; }
    .al   { font-size: 11.5px; fill: #6b7280; }
    .arrow{ stroke: #9ca3af; stroke-width: 1.9; fill: none; }
    .back { stroke: #9254de; stroke-width: 1.9; fill: none; stroke-dasharray: 6 4; }
    .lane { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: .05em; }
    .note { font-size: 12px; fill: #92400e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9254de"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="500" fill="#ffffff"/>

  <text class="lane" x="30" y="36">ĐƯỜNG ĐI BÌNH THƯỜNG</text>

  <rect class="box draft" x="30"  y="80" width="200" height="62"/>
  <text class="tb" x="130" y="106" text-anchor="middle">Nháp</text>
  <text class="ts" x="130" y="126" text-anchor="middle">Draft</text>

  <rect class="box run" x="290" y="80" width="200" height="62"/>
  <text class="tb" x="390" y="106" text-anchor="middle">Chờ giao · chờ hoá đơn</text>
  <text class="ts" x="390" y="126" text-anchor="middle">To Deliver and Bill</text>

  <rect class="box run" x="550" y="80" width="200" height="62"/>
  <text class="tb" x="650" y="106" text-anchor="middle">Còn nợ một vế</text>
  <text class="ts" x="650" y="126" text-anchor="middle">To Bill · To Deliver</text>

  <rect class="box fin" x="810" y="80" width="200" height="62"/>
  <text class="tb" x="910" y="106" text-anchor="middle">Hoàn tất</text>
  <text class="ts" x="910" y="126" text-anchor="middle">Completed</text>

  <line class="arrow" x1="230" y1="111" x2="286" y2="111" marker-end="url(#ah)"/>
  <text class="al" x="258" y="68" text-anchor="middle">Xác nhận đơn</text>
  <line class="arrow" x1="490" y1="111" x2="546" y2="111" marker-end="url(#ah)"/>
  <text class="al" x="518" y="68" text-anchor="middle">đã giao hoặc đã xuất hoá đơn</text>
  <line class="arrow" x1="750" y1="111" x2="806" y2="111" marker-end="url(#ah)"/>
  <text class="al" x="778" y="68" text-anchor="middle">giao đủ và xuất hoá đơn đủ</text>

  <text class="lane" x="30" y="196">NHÁNH RẼ</text>

  <rect class="box hold" x="290" y="210" width="200" height="62"/>
  <text class="tb" x="390" y="236" text-anchor="middle">Tạm giữ</text>
  <text class="ts" x="390" y="256" text-anchor="middle">On Hold</text>

  <rect class="box hold" x="550" y="210" width="200" height="62"/>
  <text class="tb" x="650" y="236" text-anchor="middle">Đóng đơn</text>
  <text class="ts" x="650" y="256" text-anchor="middle">Closed</text>

  <rect class="box bad" x="810" y="210" width="200" height="62"/>
  <text class="tb" x="910" y="236" text-anchor="middle">Đã huỷ</text>
  <text class="ts" x="910" y="256" text-anchor="middle">Cancelled</text>

  <line class="arrow" x1="390" y1="142" x2="390" y2="206" marker-end="url(#ah)"/>
  <line class="arrow" x1="650" y1="142" x2="650" y2="206" marker-end="url(#ah)"/>
  <line class="arrow" x1="910" y1="142" x2="910" y2="206" marker-end="url(#ah)"/>

  <rect class="box draft" x="810" y="320" width="200" height="56"/>
  <text class="tb" x="910" y="344" text-anchor="middle">Bản sửa lại</text>
  <text class="ts" x="910" y="363" text-anchor="middle">Amend</text>
  <line class="back" x1="910" y1="272" x2="910" y2="316" marker-end="url(#ap)"/>
  <polyline class="back" points="810,348 130,348 130,146" marker-end="url(#ap)"/>
  <text class="al" x="400" y="340" text-anchor="middle">bản mới ở trạng thái Nháp, mã có hậu tố -1</text>

  <text class="note" x="30" y="418">Đơn hàng phát sinh càng nhiều chứng từ phía sau thì càng bị khoá chặt: muốn sửa phải huỷ ngược theo thứ tự Phiếu thu, Hoá đơn, Phiếu giao hàng.</text>
  <text class="note" x="30" y="442">Khi còn Phiếu giao hàng hiệu lực thì không đóng và không huỷ được đơn hàng.</text>
  <text class="note" x="30" y="466">Sơ đồ đặt mỗi nhánh rẽ dưới một trạng thái chỉ để các đường không cắt nhau, không hàm ý nhánh đó chỉ đi ra từ trạng thái phía trên.</text>
</svg>
