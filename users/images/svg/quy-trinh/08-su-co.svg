<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 540" width="1010" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Quy trình xử lý sự cố</title>
  <desc>Khách báo hỏng, nhân viên lập phiếu sự cố gắn về đơn hàng gốc, phân loại theo nhóm và loại rồi gán người xử lý. Từ đó có hai đường: xử lý dứt điểm qua điện thoại rồi đóng phiếu, hoặc lập phiếu công việc loại Sự cố để cử kỹ thuật viên xuống hiện trường; nếu phải thay vật tư có tính tiền thì lập đơn bán hàng mới từ chính phiếu sự cố.</desc>
  <style>
    .box  { rx: 11; ry: 11; stroke-width: 1.6; }
    .in   { fill: #fff1f0; stroke: #ff4d4f; }
    .work { fill: #e6f4ff; stroke: #299dd8; }
    .sale { fill: #f9f0ff; stroke: #9254de; }
    .fin  { fill: #f6ffed; stroke: #54ab78; }
    .dec  { fill: #fffbe6; stroke: #d4b106; }
    .tb   { font-size: 13.5px; font-weight: 600; fill: #111827; }
    .ts   { font-size: 11.5px; fill: #4b5563; }
    .al   { font-size: 11.5px; fill: #6b7280; }
    .arrow{ stroke: #9ca3af; stroke-width: 1.8; fill: none; }
    .lane { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: .05em; }
    .note { font-size: 12px; fill: #92400e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1010" height="540" fill="#ffffff"/>

  <text class="lane" x="36" y="36">TIẾP NHẬN</text>

  <rect class="box in" x="60" y="50" width="200" height="62"/>
  <text class="tb" x="160" y="76" text-anchor="middle">Khách báo hỏng</text>
  <text class="ts" x="160" y="96" text-anchor="middle">tổng đài · Zalo · KTV báo</text>

  <rect class="box in" x="290" y="50" width="200" height="62"/>
  <text class="tb" x="390" y="76" text-anchor="middle">Lập phiếu sự cố</text>
  <text class="ts" x="390" y="96" text-anchor="middle">Issue · gắn đơn hàng gốc</text>

  <rect class="box in" x="520" y="50" width="200" height="62"/>
  <text class="tb" x="620" y="76" text-anchor="middle">Phân loại Nhóm · Loại</text>
  <text class="ts" x="620" y="96" text-anchor="middle">hai ô bắt buộc</text>

  <rect class="box in" x="750" y="50" width="200" height="62"/>
  <text class="tb" x="850" y="76" text-anchor="middle">Gán người xử lý</text>
  <text class="ts" x="850" y="96" text-anchor="middle">Handling Person</text>

  <line class="arrow" x1="260" y1="81" x2="286" y2="81" marker-end="url(#ah)"/>
  <line class="arrow" x1="490" y1="81" x2="516" y2="81" marker-end="url(#ah)"/>
  <line class="arrow" x1="720" y1="81" x2="746" y2="81" marker-end="url(#ah)"/>

  <text class="lane" x="36" y="176">HAI ĐƯỜNG XỬ LÝ</text>

  <polyline class="arrow" points="850,112 850,152 205,152 205,186" marker-end="url(#ah)"/>
  <polyline class="arrow" points="850,152 555,152 555,186" marker-end="url(#ah)"/>

  <rect class="box fin" x="100" y="190" width="210" height="62"/>
  <text class="tb" x="205" y="216" text-anchor="middle">Xử lý qua điện thoại</text>
  <text class="ts" x="205" y="236" text-anchor="middle">không cần xuống hiện trường</text>

  <rect class="box work" x="450" y="190" width="210" height="62"/>
  <text class="tb" x="555" y="216" text-anchor="middle">Lập Phiếu công việc</text>
  <text class="ts" x="555" y="236" text-anchor="middle">loại việc: Sự cố</text>

  <rect class="box work" x="760" y="190" width="210" height="62"/>
  <text class="tb" x="865" y="216" text-anchor="middle">Lịch hẹn · KTV xử lý</text>
  <text class="ts" x="865" y="236" text-anchor="middle">như quy trình hiện trường</text>

  <line class="arrow" x1="660" y1="221" x2="756" y2="221" marker-end="url(#ah)"/>

  <rect class="box dec" x="760" y="310" width="210" height="62"/>
  <text class="tb" x="865" y="336" text-anchor="middle">Có thay vật tư tính tiền?</text>
  <text class="ts" x="865" y="356" text-anchor="middle">quyết định tại hiện trường</text>

  <line class="arrow" x1="865" y1="252" x2="865" y2="306" marker-end="url(#ah)"/>

  <rect class="box sale" x="450" y="310" width="210" height="62"/>
  <text class="tb" x="555" y="336" text-anchor="middle">Đơn bán hàng mới</text>
  <text class="ts" x="555" y="356" text-anchor="middle">lập từ chính phiếu sự cố</text>

  <line class="arrow" x1="756" y1="341" x2="664" y2="341" marker-end="url(#ah)"/>
  <text class="al" x="710" y="330" text-anchor="middle">có</text>

  <rect class="box fin" x="100" y="310" width="210" height="62"/>
  <text class="tb" x="205" y="336" text-anchor="middle">Đóng phiếu sự cố</text>
  <text class="ts" x="205" y="356" text-anchor="middle">Issue · Closed</text>

  <line class="arrow" x1="446" y1="341" x2="314" y2="341" marker-end="url(#ah)"/>
  <text class="al" x="380" y="330" text-anchor="middle">giao hàng · thu tiền xong</text>
  <line class="arrow" x1="205" y1="252" x2="205" y2="306" marker-end="url(#ah)"/>
  <polyline class="arrow" points="865,372 865,412 250,412 250,376" marker-end="url(#ah)"/>
  <text class="al" x="600" y="404" text-anchor="middle">không phát sinh chi phí</text>

  <text class="note" x="60" y="458">Phiếu sự cố luôn gắn về đơn hàng gốc — nhờ vậy tra được khách đã mua máy nào, lắp ngày nào, đã bảo dưỡng tới đâu.</text>
  <text class="note" x="60" y="482">Hạn xử lý của nhân viên sự cố đếm từ lúc mở phiếu; hạn của kỹ thuật viên đếm từ lúc phiếu công việc được lập.</text>
  <text class="note" x="60" y="506">Phiếu sự cố và phiếu công việc có trạng thái độc lập: đóng phiếu sự cố không tự đóng phiếu công việc và ngược lại.</text>
</svg>
