<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 520" width="1010" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Vòng bảo dưỡng lặp lại</title>
  <desc>Đơn hàng hoàn tất sinh ra các dòng nhắc theo vật tư; hệ thống gom các dòng nhắc của cùng một khách có lịch gần nhau thành một phiếu nhắc bảo dưỡng, phân người phụ trách rồi gọi khách. Phiếu chốt được sẽ mở đơn bán hàng mới và quay lại đầu vòng; phiếu chưa chốt được ghi nhận là hẹn lại, không liên hệ được hoặc không có nhu cầu.</desc>
  <style>
    .box  { rx: 11; ry: 11; stroke-width: 1.6; }
    .fin  { fill: #f6ffed; stroke: #54ab78; }
    .auto { fill: #e6f4ff; stroke: #299dd8; }
    .human{ fill: #f9f0ff; stroke: #9254de; }
    .warn { fill: #fffbe6; stroke: #d4b106; }
    .bad  { fill: #fff1f0; stroke: #ff4d4f; }
    .tb   { font-size: 13.5px; font-weight: 600; fill: #111827; }
    .ts   { font-size: 11.5px; fill: #4b5563; }
    .arrow{ stroke: #9ca3af; stroke-width: 1.8; fill: none; }
    .loop { stroke: #54ab78; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .lbl  { font-size: 12px; fill: #135200; font-weight: 600; }
    .lane { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: .05em; }
    .note { font-size: 12px; fill: #92400e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#54ab78"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1010" height="520" fill="#ffffff"/>

  <text class="lane" x="36" y="36">HỆ THỐNG TỰ LÀM</text>

  <rect class="box fin" x="60" y="50" width="200" height="62"/>
  <text class="tb" x="160" y="76" text-anchor="middle">Đơn hàng hoàn tất</text>
  <text class="ts" x="160" y="96" text-anchor="middle">Sales Order · Completed</text>

  <rect class="box auto" x="290" y="50" width="200" height="62"/>
  <text class="tb" x="390" y="76" text-anchor="middle">Nhắc theo vật tư</text>
  <text class="ts" x="390" y="96" text-anchor="middle">Item Service Reminder</text>

  <rect class="box auto" x="520" y="50" width="200" height="62"/>
  <text class="tb" x="620" y="76" text-anchor="middle">Gom theo khách</text>
  <text class="ts" x="620" y="96" text-anchor="middle">cùng khách hàng, lịch gần nhau</text>

  <rect class="box auto" x="750" y="50" width="200" height="62"/>
  <text class="tb" x="850" y="76" text-anchor="middle">Phiếu nhắc bảo dưỡng</text>
  <text class="ts" x="850" y="96" text-anchor="middle">Service Ticket Reminder</text>

  <line class="arrow" x1="260" y1="81" x2="286" y2="81" marker-end="url(#ah)"/>
  <line class="arrow" x1="490" y1="81" x2="516" y2="81" marker-end="url(#ah)"/>
  <line class="arrow" x1="720" y1="81" x2="746" y2="81" marker-end="url(#ah)"/>

  <text class="lane" x="36" y="176">NGƯỜI LÀM</text>

  <rect class="box human" x="750" y="190" width="200" height="62"/>
  <text class="tb" x="850" y="216" text-anchor="middle">Phân người phụ trách</text>
  <text class="ts" x="850" y="236" text-anchor="middle">tự động hoặc phân theo tháng</text>

  <rect class="box human" x="520" y="190" width="200" height="62"/>
  <text class="tb" x="620" y="216" text-anchor="middle">Liên hệ khách hàng</text>
  <text class="ts" x="620" y="236" text-anchor="middle">nhân viên dịch vụ hẹn lịch</text>

  <line class="arrow" x1="850" y1="112" x2="850" y2="186" marker-end="url(#ah)"/>
  <line class="arrow" x1="746" y1="221" x2="724" y2="221" marker-end="url(#ah)"/>

  <text class="lane" x="36" y="316">KẾT QUẢ</text>

  <polyline class="arrow" points="540,252 540,268 160,268 160,326" marker-end="url(#ah)"/>
  <polyline class="arrow" points="580,252 580,290 390,290 390,326" marker-end="url(#ah)"/>
  <polyline class="arrow" points="620,252 620,326" marker-end="url(#ah)"/>
  <polyline class="arrow" points="700,252 700,278 850,278 850,326" marker-end="url(#ah)"/>

  <rect class="box fin" x="60" y="330" width="200" height="60"/>
  <text class="tb" x="160" y="354" text-anchor="middle">Khách hàng đồng ý</text>
  <text class="ts" x="160" y="373" text-anchor="middle">lập đơn mới, phiếu Converted</text>

  <rect class="box warn" x="290" y="330" width="200" height="60"/>
  <text class="tb" x="390" y="354" text-anchor="middle">Khách hàng hẹn lại</text>
  <text class="ts" x="390" y="373" text-anchor="middle">dời ngày nhắc sang đợt sau</text>

  <rect class="box warn" x="520" y="330" width="200" height="60"/>
  <text class="tb" x="620" y="354" text-anchor="middle">Không liên hệ được</text>
  <text class="ts" x="620" y="373" text-anchor="middle">liên hệ lại đợt sau</text>

  <rect class="box bad" x="750" y="330" width="200" height="60"/>
  <text class="tb" x="850" y="354" text-anchor="middle">Không có nhu cầu</text>
  <text class="ts" x="850" y="373" text-anchor="middle">đóng phiếu kèm lý do</text>

  <polyline class="loop" points="160,390 16,390 16,81 56,81" marker-end="url(#ag)"/>
  <text class="lbl" x="284" y="414">Đơn hàng mới hoàn tất lại sinh vòng nhắc kế tiếp: vòng đời khách hàng khép kín</text>

  <text class="note" x="60" y="454">Mỗi vật tư có chu kỳ nhắc riêng; hệ thống tự đặt ngày hẹn kế tiếp ngay khi vòng hiện tại được sinh ra.</text>
  <text class="note" x="60" y="478">Khách hàng còn phiếu chờ xử lý thì vòng mới được hoãn lại, nhằm tránh liên hệ hai lần cho cùng một lần đến.</text>
  <text class="note" x="60" y="502">Phiếu nhắc không phải đơn hàng: chỉ phát sinh doanh thu khi khách hàng đồng ý và đơn bán hàng mới được lập.</text>
</svg>
