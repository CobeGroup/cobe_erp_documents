<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 570" width="1010" height="570" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Toàn cảnh quy trình hợp nhất COBE ERP</title>
  <desc>Sơ đồ vòng tròn: khách tiềm năng chuyển thành khách hàng rồi mở đơn bán hàng; đơn sinh phiếu công việc, yêu cầu vật tư và lịch hẹn; kỹ thuật viên ra hiện trường lập phiếu giao hàng, hoá đơn và phiếu thu; đơn hoàn tất sinh phiếu nhắc bảo dưỡng và phiếu nhắc lại mở đơn bán hàng mới. Sự cố là cửa vào thứ hai, đi thẳng vào phiếu công việc.</desc>
  <style>
    .box  { rx: 11; ry: 11; stroke-width: 1.6; }
    .sale { fill: #f9f0ff; stroke: #9254de; }
    .svc  { fill: #e6f4ff; stroke: #299dd8; }
    .wh   { fill: #fffbe6; stroke: #d4b106; }
    .fin  { fill: #f6ffed; stroke: #54ab78; }
    .bad  { fill: #fff1f0; stroke: #ff4d4f; }
    .tb   { font-size: 14px; font-weight: 600; fill: #111827; }
    .ts   { font-size: 11.5px; fill: #4b5563; }
    .num  { font-size: 11px; font-weight: 700; fill: #6b7280; }
    .arrow{ stroke: #9ca3af; stroke-width: 1.9; fill: none; }
    .loop { stroke: #54ab78; stroke-width: 2.2; fill: none; stroke-dasharray: 7 4; }
    .lbl  { font-size: 12px; fill: #135200; font-weight: 600; }
    .lane { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: .05em; }
    .lgd  { font-size: 11.5px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#54ab78"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1010" height="570" fill="#ffffff"/>

  <text class="lane" x="28" y="34">ĐẦU VÀO</text>

  <!-- hàng vào -->
  <rect class="box sale" x="70"  y="50" width="200" height="60"/>
  <text class="num" x="82"  y="68">①</text>
  <text class="tb"  x="170" y="76" text-anchor="middle">Khách tiềm năng</text>
  <text class="ts"  x="170" y="95" text-anchor="middle">Lead</text>

  <rect class="box sale" x="310" y="50" width="200" height="60"/>
  <text class="num" x="322" y="68">②</text>
  <text class="tb"  x="410" y="76" text-anchor="middle">Khách hàng</text>
  <text class="ts"  x="410" y="95" text-anchor="middle">Customer</text>

  <rect class="box bad" x="550" y="50" width="200" height="60"/>
  <text class="num" x="562" y="68">⑪</text>
  <text class="tb"  x="650" y="76" text-anchor="middle">Sự cố</text>
  <text class="ts"  x="650" y="95" text-anchor="middle">Issue</text>

  <line class="arrow" x1="270" y1="80" x2="306" y2="80" marker-end="url(#ah)"/>
  <polyline class="arrow" points="390,110 390,142 170,142 170,186" marker-end="url(#ah)"/>
  <polyline class="arrow" points="650,110 650,164 410,164 410,186" marker-end="url(#ah)"/>

  <!-- hàng A -->
  <rect class="box sale" x="70"  y="190" width="200" height="62"/>
  <text class="num" x="82"  y="208">③</text>
  <text class="tb"  x="170" y="216" text-anchor="middle">Đơn bán hàng</text>
  <text class="ts"  x="170" y="236" text-anchor="middle">Sales Order</text>

  <rect class="box svc" x="310" y="190" width="200" height="62"/>
  <text class="num" x="322" y="208">④</text>
  <text class="tb"  x="410" y="216" text-anchor="middle">Phiếu công việc</text>
  <text class="ts"  x="410" y="236" text-anchor="middle">FS Work Order</text>

  <rect class="box wh" x="550" y="190" width="200" height="62"/>
  <text class="num" x="562" y="208">⑤</text>
  <text class="tb"  x="650" y="216" text-anchor="middle">Yêu cầu vật tư</text>
  <text class="ts"  x="650" y="236" text-anchor="middle">Material Request</text>

  <rect class="box svc" x="790" y="190" width="200" height="62"/>
  <text class="num" x="802" y="208">⑥</text>
  <text class="tb"  x="890" y="216" text-anchor="middle">Lịch hẹn dịch vụ</text>
  <text class="ts"  x="890" y="236" text-anchor="middle">FS Service Appointment</text>

  <line class="arrow" x1="270" y1="221" x2="306" y2="221" marker-end="url(#ah)"/>
  <line class="arrow" x1="510" y1="221" x2="546" y2="221" marker-end="url(#ah)"/>
  <line class="arrow" x1="750" y1="221" x2="786" y2="221" marker-end="url(#ah)"/>
  <line class="arrow" x1="890" y1="252" x2="890" y2="346" marker-end="url(#ah)"/>

  <!-- hàng B -->
  <rect class="box fin" x="70"  y="350" width="200" height="62"/>
  <text class="num" x="82"  y="368">⑩</text>
  <text class="tb"  x="170" y="376" text-anchor="middle">Nhắc bảo dưỡng</text>
  <text class="ts"  x="170" y="396" text-anchor="middle">Service Ticket Reminder</text>

  <rect class="box fin" x="310" y="350" width="200" height="62"/>
  <text class="num" x="322" y="368">⑨</text>
  <text class="tb"  x="410" y="376" text-anchor="middle">Đơn hoàn tất</text>
  <text class="ts"  x="410" y="396" text-anchor="middle">Sales Order · Completed</text>

  <rect class="box wh" x="550" y="350" width="200" height="62"/>
  <text class="num" x="562" y="368">⑧</text>
  <text class="tb"  x="650" y="376" text-anchor="middle">Hoá đơn · Phiếu thu</text>
  <text class="ts"  x="650" y="396" text-anchor="middle">Sales Invoice · Payment Entry</text>

  <rect class="box wh" x="790" y="350" width="200" height="62"/>
  <text class="num" x="802" y="368">⑦</text>
  <text class="tb"  x="890" y="376" text-anchor="middle">Phiếu giao hàng</text>
  <text class="ts"  x="890" y="396" text-anchor="middle">Delivery Note</text>

  <line class="arrow" x1="786" y1="381" x2="754" y2="381" marker-end="url(#ah)"/>
  <line class="arrow" x1="546" y1="381" x2="514" y2="381" marker-end="url(#ah)"/>
  <line class="arrow" x1="306" y1="381" x2="274" y2="381" marker-end="url(#ah)"/>

  <!-- vòng lặp -->
  <polyline class="loop" points="170,412 170,470 28,470 28,221 66,221" marker-end="url(#ag)"/>
  <text class="lbl" x="196" y="466">Vòng lặp: khách hàng cũ đến kỳ bảo dưỡng phát sinh đơn hàng mới</text>

  <!-- chú giải -->
  <rect class="box sale" x="70"  y="500" width="18" height="18"/>
  <text class="lgd" x="96"  y="514">Bán hàng</text>
  <rect class="box svc"  x="196" y="500" width="18" height="18"/>
  <text class="lgd" x="222" y="514">Dịch vụ hiện trường</text>
  <rect class="box wh"   x="380" y="500" width="18" height="18"/>
  <text class="lgd" x="406" y="514">Kho và tiền</text>
  <rect class="box fin"  x="520" y="500" width="18" height="18"/>
  <text class="lgd" x="546" y="514">Hoàn tất và nhắc lại</text>
  <rect class="box bad"  x="700" y="500" width="18" height="18"/>
  <text class="lgd" x="726" y="514">Đầu vào từ sự cố</text>
</svg>
