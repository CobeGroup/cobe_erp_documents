<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 700" width="1140" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Ba trường hợp thu tiền tại hiện trường và hệ quả của từng trường hợp</title>
  <desc>Sau khi đã lập phiếu giao hàng, việc thu tiền rẽ thành ba nhánh. Nhánh một, khách hàng trả tiền mặt: phiếu thu được ghi nhận ngay, tiền vào tài khoản của kỹ thuật viên và trở thành công nợ cá nhân, kỹ thuật viên phải lập phiếu nộp và kế toán xác nhận thì công nợ mới hết. Nhánh hai, khách hàng chuyển khoản: ứng dụng hiện mã QR, phiếu thu nằm ở trạng thái nháp cho tới khi kế toán đối chiếu sao kê và xác nhận, khi đó hoá đơn tự phát sinh. Nhánh ba, khách hàng trả bằng cả hai hình thức: mỗi hình thức một dòng thu riêng, phần tiền mặt đi theo nhánh một, phần chuyển khoản đi theo nhánh hai, và đơn chỉ được coi là thu đủ khi cả hai phiếu đều đã chính thức. Cả ba nhánh cùng dẫn tới kết quả chung: thu đủ một trăm phần trăm thì hoá đơn phát sinh, đơn chuyển sang hoàn tất, khách hàng được cộng điểm tích luỹ và hệ thống sinh lịch bảo dưỡng cho kỳ kế tiếp.</desc>
  <style>
    .box   { rx: 10; ry: 10; stroke-width: 1.6; }
    .src   { fill: #fffbe6; stroke: #d4b106; }
    .head  { fill: #f0f5ff; stroke: #4c6ef5; }
    .money { fill: #f6ffed; stroke: #54ab78; }
    .warn  { fill: #fff7e6; stroke: #d48806; }
    .info  { fill: #e6f4ff; stroke: #299dd8; }
    .ok    { fill: #e6fffb; stroke: #13a8a8; }
    .end   { fill: #f9f0ff; stroke: #9254de; }
    .tb    { font-size: 13px; font-weight: 600; fill: #111827; }
    .ts    { font-size: 11.5px; fill: #4b5563; }
    .th    { font-size: 13.5px; font-weight: 700; fill: #1e3a8a; }
    .arrow { stroke: #9ca3af; stroke-width: 1.8; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1140" height="700" fill="#ffffff"/>
  <rect class="box src" x="60" y="30" width="1020" height="56"/>
  <text class="tb" x="570" y="54" text-anchor="middle">Đã lập phiếu giao hàng cho đơn — hệ thống cho phép thu tiền</text>
  <text class="ts" x="570" y="73" text-anchor="middle">Chưa có phiếu giao hàng thì thao tác thu tiền bị từ chối, trừ khi công ty mở tham số cho phép thu trước</text>

  <!-- nhánh ① Khách hàng trả tiền mặt -->
  <line class="arrow" x1="210" y1="89" x2="210" y2="112" marker-end="url(#ah)"/>
  <rect class="box head" x="60" y="116" width="300" height="44"/>
  <text class="th" x="210" y="144" text-anchor="middle">① Khách hàng trả tiền mặt</text>
  <line class="arrow" x1="210" y1="163" x2="210" y2="192" marker-end="url(#ah)"/>
  <rect class="box money" x="60" y="196" width="300" height="72"/>
  <text class="tb" x="210" y="225" text-anchor="middle">Phiếu thu được ghi nhận ngay</text>
  <text class="ts" x="210" y="246" text-anchor="middle">Payment Entry · Cash · chính thức</text>
  <line class="arrow" x1="210" y1="271" x2="210" y2="290" marker-end="url(#ah)"/>
  <rect class="box warn" x="60" y="294" width="300" height="72"/>
  <text class="tb" x="210" y="323" text-anchor="middle">Tiền vào tài khoản của kỹ thuật viên</text>
  <text class="ts" x="210" y="344" text-anchor="middle">Trở thành công nợ cá nhân với công ty</text>
  <line class="arrow" x1="210" y1="369" x2="210" y2="388" marker-end="url(#ah)"/>
  <rect class="box money" x="60" y="392" width="300" height="72"/>
  <text class="tb" x="210" y="421" text-anchor="middle">Kỹ thuật viên lập phiếu nộp tiền</text>
  <text class="ts" x="210" y="442" text-anchor="middle">Payment Entry · Internal Transfer · nháp</text>
  <line class="arrow" x1="210" y1="467" x2="210" y2="486" marker-end="url(#ah)"/>
  <rect class="box ok" x="60" y="490" width="300" height="72"/>
  <text class="tb" x="210" y="519" text-anchor="middle">Kế toán xác nhận phiếu nộp</text>
  <text class="ts" x="210" y="540" text-anchor="middle">Công nợ cá nhân về không</text>
  <line class="arrow" x1="210" y1="565" x2="210" y2="586" marker-end="url(#ah)"/>

  <!-- nhánh ② Khách hàng chuyển khoản -->
  <line class="arrow" x1="570" y1="89" x2="570" y2="112" marker-end="url(#ah)"/>
  <rect class="box head" x="420" y="116" width="300" height="44"/>
  <text class="th" x="570" y="144" text-anchor="middle">② Khách hàng chuyển khoản</text>
  <line class="arrow" x1="570" y1="163" x2="570" y2="192" marker-end="url(#ah)"/>
  <rect class="box info" x="420" y="196" width="300" height="72"/>
  <text class="tb" x="570" y="225" text-anchor="middle">Ứng dụng hiện mã QR của tài khoản công ty</text>
  <text class="ts" x="570" y="246" text-anchor="middle">Khách hàng quét mã và chuyển tiền</text>
  <line class="arrow" x1="570" y1="271" x2="570" y2="290" marker-end="url(#ah)"/>
  <rect class="box warn" x="420" y="294" width="300" height="72"/>
  <text class="tb" x="570" y="323" text-anchor="middle">Phiếu thu được lập ở trạng thái nháp</text>
  <text class="ts" x="570" y="344" text-anchor="middle">Payment Entry · Wire Transfer · nháp</text>
  <line class="arrow" x1="570" y1="369" x2="570" y2="388" marker-end="url(#ah)"/>
  <rect class="box money" x="420" y="392" width="300" height="72"/>
  <text class="tb" x="570" y="421" text-anchor="middle">Kế toán đối chiếu sao kê ngân hàng</text>
  <text class="ts" x="570" y="442" text-anchor="middle">Xác nhận phiếu thu trên hệ thống</text>
  <line class="arrow" x1="570" y1="467" x2="570" y2="486" marker-end="url(#ah)"/>
  <rect class="box ok" x="420" y="490" width="300" height="72"/>
  <text class="tb" x="570" y="519" text-anchor="middle">Hoá đơn tự phát sinh ngay khi xác nhận</text>
  <text class="ts" x="570" y="540" text-anchor="middle">Không cần thao tác thêm</text>
  <line class="arrow" x1="570" y1="565" x2="570" y2="586" marker-end="url(#ah)"/>

  <!-- nhánh ③ Trả bằng cả hai hình thức -->
  <line class="arrow" x1="930" y1="89" x2="930" y2="112" marker-end="url(#ah)"/>
  <rect class="box head" x="780" y="116" width="300" height="44"/>
  <text class="th" x="930" y="144" text-anchor="middle">③ Trả bằng cả hai hình thức</text>
  <line class="arrow" x1="930" y1="163" x2="930" y2="192" marker-end="url(#ah)"/>
  <rect class="box info" x="780" y="196" width="300" height="72"/>
  <text class="tb" x="930" y="225" text-anchor="middle">Lập hai dòng thu trên cùng một đơn</text>
  <text class="ts" x="930" y="246" text-anchor="middle">Mỗi hình thức một dòng riêng</text>
  <line class="arrow" x1="930" y1="271" x2="930" y2="290" marker-end="url(#ah)"/>
  <rect class="box money" x="780" y="294" width="300" height="72"/>
  <text class="tb" x="930" y="323" text-anchor="middle">Phần tiền mặt đi theo nhánh ①</text>
  <text class="ts" x="930" y="344" text-anchor="middle">Ghi nhận ngay, phát sinh công nợ cá nhân</text>
  <line class="arrow" x1="930" y1="369" x2="930" y2="388" marker-end="url(#ah)"/>
  <rect class="box warn" x="780" y="392" width="300" height="72"/>
  <text class="tb" x="930" y="421" text-anchor="middle">Phần chuyển khoản đi theo nhánh ②</text>
  <text class="ts" x="930" y="442" text-anchor="middle">Nằm ở trạng thái nháp cho tới khi kế toán xác nhận</text>
  <line class="arrow" x1="930" y1="467" x2="930" y2="486" marker-end="url(#ah)"/>
  <rect class="box ok" x="780" y="490" width="300" height="72"/>
  <text class="tb" x="930" y="519" text-anchor="middle">Đơn đủ khi cả hai phiếu đều chính thức</text>
  <text class="ts" x="930" y="540" text-anchor="middle">Còn một phiếu nháp thì đơn vẫn là còn nợ</text>
  <line class="arrow" x1="930" y1="565" x2="930" y2="586" marker-end="url(#ah)"/>

  <rect class="box end" x="60" y="590" width="1020" height="74"/>
  <text class="tb" x="570" y="618" text-anchor="middle">Đơn được thu đủ một trăm phần trăm</text>
  <text class="ts" x="570" y="640" text-anchor="middle">Hoá đơn phát sinh · đơn chuyển sang Hoàn tất · khách hàng được cộng điểm tích luỹ · hệ thống sinh lịch bảo dưỡng kỳ kế tiếp</text>
