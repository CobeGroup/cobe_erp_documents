  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#nop-tien" target="_top"><title>Lập phiếu nộp tiền</title><rect class="hot" x="60" y="392" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#nop-tien" target="_top"><title>Kế toán xác nhận phiếu nộp</title><rect class="hot" x="60" y="490" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#dieu-kien-thu" target="_top"><title>Mã QR chuyển khoản</title><rect class="hot" x="420" y="196" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#ba-truong-hop" target="_top"><title>Phiếu thu ở trạng thái nháp</title><rect class="hot" x="420" y="294" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#ba-truong-hop" target="_top"><title>Kế toán đối chiếu sao kê</title><rect class="hot" x="420" y="392" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#hoa-don" target="_top"><title>Hoá đơn tự phát sinh</title><rect class="hot" x="420" y="490" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#ba-truong-hop" target="_top"><title>Hai dòng thu trên một đơn</title><rect class="hot" x="780" y="196" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#ba-truong-hop" target="_top"><title>Phần tiền mặt</title><rect class="hot" x="780" y="294" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#ba-truong-hop" target="_top"><title>Phần chuyển khoản</title><rect class="hot" x="780" y="392" width="300" height="72" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#ba-truong-hop" target="_top"><title>Khi nào đơn được tính là đủ</title><rect class="hot" x="780" y="490" width="300" height="72" rx="10" ry="10"/></a>
