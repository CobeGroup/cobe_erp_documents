<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" width="1060" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Điều phối và thực hiện tại hiện trường</title>
  <desc>Ba tầng: điều phối lập phiếu công việc, lập lịch hẹn và gán kỹ thuật viên; kỹ thuật viên nhận thông báo, bắt đầu di chuyển, check-in làm việc rồi check-out; kết quả là lịch hẹn hoàn tất, phiếu công việc hoàn tất và đóng phiếu.</desc>
  <style>
    .box  { rx: 11; ry: 11; stroke-width: 1.6; }
    .disp { fill: #f9f0ff; stroke: #9254de; }
    .tech { fill: #e6f4ff; stroke: #299dd8; }
    .fin  { fill: #f6ffed; stroke: #54ab78; }
    .tb   { font-size: 13.5px; font-weight: 600; fill: #111827; }
    .ts   { font-size: 11.5px; fill: #4b5563; }
    .arrow{ stroke: #9ca3af; stroke-width: 1.9; fill: none; }
    .lane { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: .05em; }
    .note { font-size: 12px; fill: #92400e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1060" height="500" fill="#ffffff"/>

  <text class="lane" x="24" y="100">ĐIỀU PHỐI</text>
  <text class="lane" x="24" y="240">KỸ THUẬT VIÊN</text>
  <text class="lane" x="24" y="390">KẾT QUẢ</text>

  <!-- điều phối -->
  <rect class="box disp" x="140" y="70" width="190" height="62"/>
  <text class="tb" x="235" y="96"  text-anchor="middle">Lập Phiếu công việc</text>
  <text class="ts" x="235" y="116" text-anchor="middle">từ đơn hàng hoặc sự cố</text>

  <rect class="box disp" x="370" y="70" width="190" height="62"/>
  <text class="tb" x="465" y="96"  text-anchor="middle">Lập Lịch hẹn</text>
  <text class="ts" x="465" y="116" text-anchor="middle">FS Service Appointment</text>

  <rect class="box disp" x="600" y="70" width="190" height="62"/>
  <text class="tb" x="695" y="96"  text-anchor="middle">Gán kỹ thuật viên</text>
  <text class="ts" x="695" y="116" text-anchor="middle">Scheduled → Dispatched</text>

  <line class="arrow" x1="330" y1="101" x2="366" y2="101" marker-end="url(#ah)"/>
  <line class="arrow" x1="560" y1="101" x2="596" y2="101" marker-end="url(#ah)"/>
  <polyline class="arrow" points="695,132 695,172 235,172 235,206" marker-end="url(#ah)"/>

  <!-- kỹ thuật viên -->
  <rect class="box tech" x="140" y="210" width="190" height="62"/>
  <text class="tb" x="235" y="236" text-anchor="middle">Nhận thông báo</text>
  <text class="ts" x="235" y="256" text-anchor="middle">ứng dụng kỹ thuật viên</text>

  <rect class="box tech" x="370" y="210" width="190" height="62"/>
  <text class="tb" x="465" y="236" text-anchor="middle">Bắt đầu di chuyển</text>
  <text class="ts" x="465" y="256" text-anchor="middle">lịch hẹn → In Progress</text>

  <rect class="box tech" x="600" y="210" width="190" height="62"/>
  <text class="tb" x="695" y="236" text-anchor="middle">Check-in · làm việc</text>
  <text class="ts" x="695" y="256" text-anchor="middle">chụp ảnh nếu bắt buộc</text>

  <rect class="box tech" x="830" y="210" width="190" height="62"/>
  <text class="tb" x="925" y="236" text-anchor="middle">Check-out</text>
  <text class="ts" x="925" y="256" text-anchor="middle">ghi giờ kết thúc</text>

  <line class="arrow" x1="330" y1="241" x2="366" y2="241" marker-end="url(#ah)"/>
  <line class="arrow" x1="560" y1="241" x2="596" y2="241" marker-end="url(#ah)"/>
  <line class="arrow" x1="790" y1="241" x2="826" y2="241" marker-end="url(#ah)"/>
  <line class="arrow" x1="925" y1="272" x2="925" y2="356" marker-end="url(#ah)"/>

  <!-- kết quả -->
  <rect class="box fin" x="830" y="360" width="190" height="62"/>
  <text class="tb" x="925" y="386" text-anchor="middle">Lịch hẹn hoàn tất</text>
  <text class="ts" x="925" y="406" text-anchor="middle">SA · Completed</text>

  <rect class="box fin" x="600" y="360" width="190" height="62"/>
  <text class="tb" x="695" y="386" text-anchor="middle">Phiếu việc hoàn tất</text>
  <text class="ts" x="695" y="406" text-anchor="middle">WO · Completed</text>

  <rect class="box fin" x="370" y="360" width="190" height="62"/>
  <text class="tb" x="465" y="386" text-anchor="middle">Đóng phiếu</text>
  <text class="ts" x="465" y="406" text-anchor="middle">WO · Closed</text>

  <line class="arrow" x1="826" y1="391" x2="794" y2="391" marker-end="url(#ah)"/>
  <line class="arrow" x1="596" y1="391" x2="564" y2="391" marker-end="url(#ah)"/>

  <text class="note" x="140" y="458">Lịch hẹn hoàn tất KHÔNG tự đẩy Phiếu công việc sang hoàn tất — phải bấm tay hoặc chờ tác vụ đêm, và phải qua đủ sáu điều kiện.</text>
</svg>
