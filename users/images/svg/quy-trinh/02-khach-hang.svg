<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Từ khách tiềm năng đến khách hàng</title>
  <desc>Năm nguồn khách hàng xếp thành một cột bên trái, mỗi nguồn có một mũi tên riêng dẫn vào phiếu khách tiềm năng. Từ phiếu khách tiềm năng lập liên hệ và địa chỉ, sau đó chuyển đổi thành khách hàng. Dải phía dưới là bốn trạng thái của phiếu khách tiềm năng.</desc>
  <style>
    .box  { rx: 11; ry: 11; stroke-width: 1.6; }
    .src  { fill: #f0f5ff; stroke: #6b8ee8; }
    .sale { fill: #f9f0ff; stroke: #9254de; }
    .fin  { fill: #f6ffed; stroke: #54ab78; }
    .st   { fill: #fafafa; stroke: #bfbfbf; }
    .tb   { font-size: 14px; font-weight: 600; fill: #111827; }
    .tc   { font-size: 12.5px; fill: #1f2937; }
    .ts   { font-size: 11.5px; fill: #4b5563; }
    .li   { font-size: 12px; fill: #4b5563; }
    .num  { font-size: 11px; font-weight: 700; fill: #6b7280; }
    .arrow{ stroke: #9ca3af; stroke-width: 1.9; fill: none; }
    .dash { stroke: #9254de; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .lane { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: .05em; }
    .note { font-size: 12px; fill: #92400e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9254de"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="540" fill="#ffffff"/>

  <text class="lane" x="36" y="36">NGUỒN KHÁCH HÀNG</text>

  <rect class="box src" x="36" y="52"  width="186" height="40"/>
  <text class="tc" x="129" y="77"  text-anchor="middle">Hotline · Tổng đài</text>
  <rect class="box src" x="36" y="102" width="186" height="40"/>
  <text class="tc" x="129" y="127" text-anchor="middle">Facebook · Zalo</text>
  <rect class="box src" x="36" y="152" width="186" height="40"/>
  <text class="tc" x="129" y="177" text-anchor="middle">Webchat · Website</text>
  <rect class="box src" x="36" y="202" width="186" height="40"/>
  <text class="tc" x="129" y="227" text-anchor="middle">Khách hàng giới thiệu</text>
  <rect class="box src" x="36" y="252" width="186" height="40"/>
  <text class="tc" x="129" y="277" text-anchor="middle">Nhân viên nhập liệu</text>

  <line class="arrow" x1="222" y1="72"  x2="268" y2="72"  marker-end="url(#ah)"/>
  <line class="arrow" x1="222" y1="122" x2="268" y2="122" marker-end="url(#ah)"/>
  <line class="arrow" x1="222" y1="172" x2="268" y2="172" marker-end="url(#ah)"/>
  <line class="arrow" x1="222" y1="222" x2="268" y2="222" marker-end="url(#ah)"/>
  <line class="arrow" x1="222" y1="272" x2="268" y2="272" marker-end="url(#ah)"/>

  <rect class="box sale" x="272" y="52" width="210" height="240"/>
  <text class="num" x="286" y="74">①</text>
  <text class="tb"  x="377" y="98"  text-anchor="middle">Khách tiềm năng</text>
  <text class="ts"  x="377" y="118" text-anchor="middle">Lead</text>
  <text class="li"  x="296" y="160">Nội dung bắt buộc khai:</text>
  <text class="li"  x="296" y="186">· Số điện thoại</text>
  <text class="li"  x="296" y="210">· Nguồn khách hàng</text>
  <text class="li"  x="296" y="234">· Công ty tiếp nhận</text>
  <text class="li"  x="296" y="258">· Người giới thiệu (nếu có)</text>

  <rect class="box sale" x="532" y="138" width="200" height="68"/>
  <text class="num" x="546" y="158">②</text>
  <text class="tb"  x="632" y="176" text-anchor="middle">Liên hệ và Địa chỉ</text>
  <text class="ts"  x="632" y="195" text-anchor="middle">Contact · Address</text>

  <rect class="box sale" x="782" y="138" width="200" height="68"/>
  <text class="num" x="796" y="158">③</text>
  <text class="tb"  x="882" y="176" text-anchor="middle">Khách hàng</text>
  <text class="ts"  x="882" y="195" text-anchor="middle">Customer</text>

  <line class="arrow" x1="482" y1="172" x2="528" y2="172" marker-end="url(#ah)"/>
  <line class="arrow" x1="732" y1="172" x2="778" y2="172" marker-end="url(#ah)"/>

  <text class="lane" x="36" y="356">TRẠNG THÁI PHIẾU</text>

  <polyline class="dash" points="377,292 377,330 195,330 195,372" marker-end="url(#ap)"/>

  <rect class="box st"  x="100" y="376" width="190" height="42"/>
  <text class="tc" x="195" y="402" text-anchor="middle">Lead</text>
  <rect class="box st"  x="320" y="376" width="190" height="42"/>
  <text class="tc" x="415" y="402" text-anchor="middle">Interested</text>
  <rect class="box st"  x="540" y="376" width="190" height="42"/>
  <text class="tc" x="635" y="402" text-anchor="middle">Opportunity</text>
  <rect class="box fin" x="760" y="376" width="190" height="42"/>
  <text class="tc" x="855" y="402" text-anchor="middle">Converted</text>

  <line class="arrow" x1="290" y1="397" x2="316" y2="397" marker-end="url(#ah)"/>
  <line class="arrow" x1="510" y1="397" x2="536" y2="397" marker-end="url(#ah)"/>
  <line class="arrow" x1="730" y1="397" x2="756" y2="397" marker-end="url(#ah)"/>

  <text class="note" x="100" y="456">Hai trạng thái ở giữa là tuỳ chọn: phần lớn phiếu chuyển thẳng từ Lead sang Converted khi khách hàng đồng ý mua.</text>
  <text class="note" x="100" y="480">Mọi khách hàng trên hệ thống đều được sinh ra từ một phiếu khách tiềm năng; không có khách hàng nào được lập trực tiếp.</text>
  <text class="note" x="100" y="504">Người giới thiệu phải được khai ngay ở bước ①; khai sau khi chuyển đổi thì liên kết tính thưởng không còn chính xác.</text>
