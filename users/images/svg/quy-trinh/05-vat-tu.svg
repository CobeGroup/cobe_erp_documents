<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 520" width="1090" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Vòng đời vật tư của kỹ thuật viên</title>
  <desc>Ba tầng đọc theo chiều dọc: ai làm, chứng từ nào sinh ra, và hàng đang nằm ở kho nào. Kỹ thuật viên yêu cầu hàng, kho xuất sang kho kỹ thuật viên, kỹ thuật viên giao cho khách, phần không giao sinh nghĩa vụ trả, kỹ thuật viên lập phiếu trả ở trạng thái nháp và chỉ khi kho duyệt thì hàng mới về kho công ty và nợ mới được xoá.</desc>
  <style>
    .box  { rx: 10; ry: 10; stroke-width: 1.6; }
    .tech { fill: #e6f4ff; stroke: #299dd8; }
    .wh   { fill: #f9f0ff; stroke: #9254de; }
    .doc  { fill: #fffbe6; stroke: #d4b106; }
    .docd { fill: #f6ffed; stroke: #54ab78; }
    .loc  { fill: #fafafa; stroke: #bfbfbf; }
    .tb   { font-size: 13px; font-weight: 600; fill: #111827; }
    .ts   { font-size: 11px; fill: #4b5563; }
    .arrow{ stroke: #9ca3af; stroke-width: 1.8; fill: none; }
    .thin { stroke: #d0d0d0; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
    .lane { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: .05em; }
    .note { font-size: 12px; fill: #92400e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1090" height="520" fill="#ffffff"/>

  <text class="lane" x="20" y="72">AI LÀM</text>
  <text class="lane" x="20" y="200">CHỨNG TỪ</text>
  <text class="lane" x="20" y="338">HÀNG Ở ĐÂU</text>

  <!-- ai làm -->
  <rect class="box tech" x="140" y="46" width="165" height="52"/>
  <text class="tb" x="222" y="68" text-anchor="middle">Kỹ thuật viên</text>
  <text class="ts" x="222" y="86" text-anchor="middle">bấm Yêu cầu hàng</text>

  <rect class="box wh" x="330" y="46" width="165" height="52"/>
  <text class="tb" x="412" y="68" text-anchor="middle">Nhân viên kho</text>
  <text class="ts" x="412" y="86" text-anchor="middle">xuất hàng theo yêu cầu</text>

  <rect class="box tech" x="520" y="46" width="165" height="52"/>
  <text class="tb" x="602" y="68" text-anchor="middle">Kỹ thuật viên</text>
  <text class="ts" x="602" y="86" text-anchor="middle">giao hàng cho khách</text>

  <rect class="box tech" x="710" y="46" width="165" height="52"/>
  <text class="tb" x="792" y="68" text-anchor="middle">Kỹ thuật viên</text>
  <text class="ts" x="792" y="86" text-anchor="middle">bấm Trả vật tư</text>

  <rect class="box wh" x="900" y="46" width="165" height="52"/>
  <text class="tb" x="982" y="68" text-anchor="middle">Nhân viên kho</text>
  <text class="ts" x="982" y="86" text-anchor="middle">đếm hàng, duyệt phiếu</text>

  <line class="arrow" x1="305" y1="72" x2="326" y2="72" marker-end="url(#ah)"/>
  <line class="arrow" x1="495" y1="72" x2="516" y2="72" marker-end="url(#ah)"/>
  <line class="arrow" x1="685" y1="72" x2="706" y2="72" marker-end="url(#ah)"/>
  <line class="arrow" x1="875" y1="72" x2="896" y2="72" marker-end="url(#ah)"/>

  <!-- chứng từ -->
  <rect class="box doc" x="140" y="172" width="165" height="58"/>
  <text class="tb" x="222" y="196" text-anchor="middle">Yêu cầu vật tư</text>
  <text class="ts" x="222" y="215" text-anchor="middle">Material Request</text>

  <rect class="box docd" x="330" y="172" width="165" height="58"/>
  <text class="tb" x="412" y="196" text-anchor="middle">Phiếu xuất kho</text>
  <text class="ts" x="412" y="215" text-anchor="middle">Stock Entry · đã duyệt</text>

  <rect class="box docd" x="520" y="172" width="165" height="58"/>
  <text class="tb" x="602" y="196" text-anchor="middle">Phiếu giao hàng</text>
  <text class="ts" x="602" y="215" text-anchor="middle">Delivery Note</text>

  <rect class="box doc" x="710" y="172" width="165" height="58"/>
  <text class="tb" x="792" y="196" text-anchor="middle">Phiếu trả · Nháp</text>
  <text class="ts" x="792" y="215" text-anchor="middle">chưa đụng sổ kho</text>

  <rect class="box docd" x="900" y="172" width="165" height="58"/>
  <text class="tb" x="982" y="196" text-anchor="middle">Phiếu trả đã duyệt</text>
  <text class="ts" x="982" y="215" text-anchor="middle">nghĩa vụ mới được xoá</text>

  <line class="thin" x1="222" y1="98" x2="222" y2="168"/>
  <line class="thin" x1="412" y1="98" x2="412" y2="168"/>
  <line class="thin" x1="602" y1="98" x2="602" y2="168"/>
  <line class="thin" x1="792" y1="98" x2="792" y2="168"/>
  <line class="thin" x1="982" y1="98" x2="982" y2="168"/>

  <!-- hàng ở đâu -->
  <rect class="box loc" x="140" y="310" width="165" height="52"/>
  <text class="tb" x="222" y="332" text-anchor="middle">Kho công ty</text>
  <text class="ts" x="222" y="350" text-anchor="middle">chưa đổi chỗ</text>

  <rect class="box loc" x="330" y="310" width="165" height="52"/>
  <text class="tb" x="412" y="332" text-anchor="middle">Kho kỹ thuật viên</text>
  <text class="ts" x="412" y="350" text-anchor="middle">hàng theo xe</text>

  <rect class="box loc" x="520" y="310" width="165" height="52"/>
  <text class="tb" x="602" y="332" text-anchor="middle">Nhà khách</text>
  <text class="ts" x="602" y="350" text-anchor="middle">phần dư sinh nghĩa vụ trả</text>

  <rect class="box loc" x="710" y="310" width="165" height="52"/>
  <text class="tb" x="792" y="332" text-anchor="middle">Vẫn ở kho KTV</text>
  <text class="ts" x="792" y="350" text-anchor="middle">nháp không chuyển hàng</text>

  <rect class="box loc" x="900" y="310" width="165" height="52"/>
  <text class="tb" x="982" y="332" text-anchor="middle">Về kho công ty</text>
  <text class="ts" x="982" y="350" text-anchor="middle">sổ kho thay đổi</text>

  <line class="thin" x1="222" y1="230" x2="222" y2="306"/>
  <line class="thin" x1="412" y1="230" x2="412" y2="306"/>
  <line class="thin" x1="602" y1="230" x2="602" y2="306"/>
  <line class="thin" x1="792" y1="230" x2="792" y2="306"/>
  <line class="thin" x1="982" y1="230" x2="982" y2="306"/>

  <text class="note" x="140" y="404">Nghĩa vụ trả sinh ra ngay lúc lập Phiếu giao hàng, không phải lúc trả: số cần trả = số mang đi − số thực giao.</text>
  <text class="note" x="140" y="428">Phiếu trả còn nháp thì chỉ giữ chỗ: hàng chưa về kho, nợ chưa xoá, nhưng ứng dụng khoá phần đó để khỏi lập trùng.</text>
  <text class="note" x="140" y="452">Vật tư dùng hẳn tại hiện trường đi đường riêng: Phiếu xuất vật tư (Stock Entry · Material Issue), tự duyệt ngay.</text>
  <text class="note" x="140" y="476">Huỷ Phiếu công việc không tự trả kho — hàng đã nhận vẫn phải trả bằng phiếu trả như thường.</text>
</svg>
