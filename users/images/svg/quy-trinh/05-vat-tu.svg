  <a href="../../../Quy-Trinh-04-Vat-Tu.html#yeu-cau" target="_top"><title>Kho xử lý yêu cầu</title><rect class="hot" x="330" y="46" width="165" height="52" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#giao-hang" target="_top"><title>Giao hàng cho khách hàng</title><rect class="hot" x="520" y="46" width="165" height="52" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-04-Vat-Tu.html#tra-ve" target="_top"><title>Lập phiếu trả vật tư</title><rect class="hot" x="710" y="46" width="165" height="52" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-04-Vat-Tu.html#tra-ve" target="_top"><title>Kho duyệt phiếu trả</title><rect class="hot" x="900" y="46" width="165" height="52" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-04-Vat-Tu.html#yeu-cau" target="_top"><title>Yêu cầu vật tư</title><rect class="hot" x="140" y="172" width="165" height="58" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-04-Vat-Tu.html#yeu-cau" target="_top"><title>Phiếu xuất kho</title><rect class="hot" x="330" y="172" width="165" height="58" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#giao-hang" target="_top"><title>Phiếu giao hàng</title><rect class="hot" x="520" y="172" width="165" height="58" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-04-Vat-Tu.html#tra-ve" target="_top"><title>Phiếu trả ở trạng thái nháp</title><rect class="hot" x="710" y="172" width="165" height="58" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-04-Vat-Tu.html#tra-ve" target="_top"><title>Phiếu trả đã được duyệt</title><rect class="hot" x="900" y="172" width="165" height="58" rx="10" ry="10"/></a>
  <!-- /VUNG-BAM -->
</svg>
