<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" width="1010" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Sáu điều kiện để hoàn thành phiếu công việc</title>
  <desc>Sáu điều kiện xếp chồng: trạng thái cho phép, các bước công việc bắt buộc đã xong, mọi lịch hẹn đã kết thúc, tiền và vật tư đã được thanh toán và hoàn trả đầy đủ, đơn bán hàng liên kết đã xong, và yêu cầu riêng theo loại việc. Đáp ứng đủ sáu điều kiện thì phiếu chuyển sang hoàn thành; thiếu bất kỳ điều kiện nào thì hệ thống từ chối và nêu rõ lý do.</desc>
  <style>
    .box  { rx: 9; ry: 9; stroke-width: 1.5; }
    .cond { fill: #e6f4ff; stroke: #299dd8; }
    .ok   { fill: #f6ffed; stroke: #54ab78; }
    .bad  { fill: #fff1f0; stroke: #ff4d4f; }
    .t    { font-size: 12.5px; fill: #111827; }
    .tb   { font-size: 13.5px; font-weight: 600; fill: #111827; }
    .ts   { font-size: 11px; fill: #4b5563; }
    .num  { font-size: 12px; font-weight: 700; fill: #0b4a6f; }
    .arrow{ stroke: #9ca3af; stroke-width: 1.7; fill: none; }
    .stop { stroke: #ff7875; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .lane { font-size: 12px; font-weight: 700; fill: #6b7280; letter-spacing: .05em; }
    .note { font-size: 12px; fill: #92400e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff7875"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1010" height="500" fill="#ffffff"/>

  <text class="lane" x="36" y="44">KIỂM LẦN LƯỢT TỪ TRÊN XUỐNG</text>

  <rect class="box cond" x="60" y="58" width="600" height="44"/>
  <text class="num" x="76" y="86">1</text>
  <text class="t" x="100" y="86">Trạng thái hiện tại cho phép chuyển sang Hoàn thành</text>
  <text class="ts" x="648" y="85" text-anchor="end">luôn kiểm tra</text>

  <rect class="box cond" x="60" y="116" width="600" height="44"/>
  <text class="num" x="76" y="144">2</text>
  <text class="t" x="100" y="144">Mọi bước công việc bắt buộc đã hoàn thành hoặc không áp dụng</text>
  <text class="ts" x="648" y="143" text-anchor="end">nếu phiếu có bước công việc</text>

  <rect class="box cond" x="60" y="174" width="600" height="44"/>
  <text class="num" x="76" y="202">3</text>
  <text class="t" x="100" y="202">Mọi lịch hẹn đã kết thúc, và phiếu có ít nhất một lịch hẹn</text>
  <text class="ts" x="648" y="201" text-anchor="end">đang bật</text>

  <rect class="box cond" x="60" y="232" width="600" height="44"/>
  <text class="num" x="76" y="260">4</text>
  <text class="t" x="100" y="260">Tiền mặt đã nộp · vật tư đã trả · đơn hàng đã thu đủ</text>
  <text class="ts" x="648" y="259" text-anchor="end">tiền: đang bật</text>

  <rect class="box cond" x="60" y="290" width="600" height="44"/>
  <text class="num" x="76" y="318">5</text>
  <text class="t" x="100" y="318">Đơn bán hàng liên kết đã Hoàn tất hoặc đã Đóng</text>
  <text class="ts" x="648" y="317" text-anchor="end">đang bật</text>

  <rect class="box cond" x="60" y="348" width="600" height="44"/>
  <text class="num" x="76" y="376">6</text>
  <text class="t" x="100" y="376">Yêu cầu riêng theo loại việc: ảnh, giao hàng, thu tiền</text>
  <text class="ts" x="648" y="375" text-anchor="end">theo từng loại việc</text>

  <line class="arrow" x1="360" y1="102" x2="360" y2="112" marker-end="url(#ah)"/>
  <line class="arrow" x1="360" y1="160" x2="360" y2="170" marker-end="url(#ah)"/>
  <line class="arrow" x1="360" y1="218" x2="360" y2="228" marker-end="url(#ah)"/>
  <line class="arrow" x1="360" y1="276" x2="360" y2="286" marker-end="url(#ah)"/>
  <line class="arrow" x1="360" y1="334" x2="360" y2="344" marker-end="url(#ah)"/>

  <rect class="box ok" x="740" y="348" width="220" height="60"/>
  <text class="tb" x="850" y="374" text-anchor="middle">Phiếu chuyển Hoàn thành</text>
  <text class="ts" x="850" y="393" text-anchor="middle">thủ công hoặc do tác vụ tự động</text>

  <polyline class="arrow" points="660,370 700,370 700,378 736,378" marker-end="url(#ah)"/>

  <rect class="box bad" x="740" y="66" width="220" height="96"/>
  <text class="tb" x="850" y="104" text-anchor="middle">Bị chặn, nêu rõ lý do</text>
  <text class="ts" x="850" y="124" text-anchor="middle">nêu đúng điều kiện còn thiếu</text>
  <text class="ts" x="850" y="140" text-anchor="middle">hiển thị giống nhau ở mọi màn hình</text>

  <polyline class="stop" points="660,80 690,80 690,78 736,78" marker-end="url(#ar)"/>
  <polyline class="stop" points="660,138 696,138 696,92 736,92" marker-end="url(#ar)"/>
  <polyline class="stop" points="660,196 702,196 702,106 736,106" marker-end="url(#ar)"/>
  <polyline class="stop" points="660,254 708,254 708,120 736,120" marker-end="url(#ar)"/>
  <polyline class="stop" points="660,312 714,312 714,134 736,134" marker-end="url(#ar)"/>
  <polyline class="stop" points="660,360 720,360 720,148 736,148" marker-end="url(#ar)"/>

  <text class="note" x="60" y="438">Tác vụ tự động còn chờ thêm một khoảng ân hạn tính từ lịch hẹn cuối cùng; chưa đủ số ngày đó thì phiếu vẫn được bỏ qua.</text>
  <text class="note" x="60" y="462">Phiếu ở trạng thái Tạm dừng được tác vụ tự động bỏ qua hoàn toàn; cần chuyển phiếu về Đang thực hiện trước.</text>
  <text class="note" x="60" y="486">Điều kiện 3 đến 6 có thể bật hoặc tắt trong cấu hình; hai công ty cấu hình khác nhau sẽ cho kết quả kiểm tra khác nhau.</text>
  <!-- VUNG-BAM: sinh bởi _tools/svg_hotspots.py, không sửa tay -->
  <style>
    .hot { fill: #1d4ed8; fill-opacity: 0; cursor: pointer; pointer-events: all; }
    .hot:hover { fill-opacity: .08; }
  </style>
  <a href="../../../Quy-Trinh-03-Hien-Truong.html#dieu-kien" target="_top"><title>Điều kiện 1</title><rect class="hot" x="60" y="58" width="600" height="44" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-03-Hien-Truong.html#dieu-kien" target="_top"><title>Điều kiện 2</title><rect class="hot" x="60" y="116" width="600" height="44" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-03-Hien-Truong.html#dieu-kien" target="_top"><title>Điều kiện 3</title><rect class="hot" x="60" y="174" width="600" height="44" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#wo-bi-chan" target="_top"><title>Điều kiện 4: tiền và vật tư</title><rect class="hot" x="60" y="232" width="600" height="44" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#wo-bi-chan" target="_top"><title>Điều kiện 5: đơn bán hàng</title><rect class="hot" x="60" y="290" width="600" height="44" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-03-Hien-Truong.html#dieu-kien" target="_top"><title>Điều kiện 6</title><rect class="hot" x="60" y="348" width="600" height="44" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-05-Giao-Hang-Thu-Tien.html#wo-bi-chan" target="_top"><title>Đọc thông báo bị chặn</title><rect class="hot" x="740" y="66" width="220" height="96" rx="10" ry="10"/></a>
  <a href="../../../Quy-Trinh-03-Hien-Truong.html#dieu-kien" target="_top"><title>Phiếu chuyển sang hoàn thành</title><rect class="hot" x="740" y="348" width="220" height="60" rx="10" ry="10"/></a>
  <!-- /VUNG-BAM -->
</svg>
