<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 578" width="1000" height="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Vòng đời một văn bản — Đến và Đi/Nội bộ</title>
  <desc>Hai nhánh: Công văn Đến (tiếp nhận, phân công, xử lý, lưu — không công bố) và Công văn Đi/Nội bộ (soạn, trình duyệt, duyệt, ban hành + công bố tới nhân viên, lưu). Khi ban hành: cấp số hiệu, gửi thông báo và email, sinh danh sách xác nhận đọc; nhân viên bấm Đã đọc, văn thư theo dõi ai đã đọc chưa đọc.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9534f"/>
    </marker>
    <style>
      .st { font-size: 14px; font-weight: 700; }
      .en { font-size: 11px; fill: #7b8794; }
      .l  { font-size: 12px; fill: #5b6b78; }
      .s  { font-size: 11.5px; fill: #7b8794; }
      .h  { font-size: 16px; font-weight: 700; fill: #26323d; }
      .cap{ font-size: 13px; font-weight: 700; }
      .tag{ font-size: 11px; fill: #7b8794; }
    </style>
  </defs>
  <rect width="1000" height="578" fill="#ffffff"/>

  <text x="40" y="34" class="h">Vòng đời một văn bản</text>
  <text x="240" y="34" class="s">Đến = nhận về &amp; xử lý  ·  Đi/Nội bộ = soạn, ban hành, công bố</text>

  <!-- ================= NHÁNH A — ĐẾN ================= -->
  <circle cx="47" cy="61" r="9" fill="#4a90c2"/>
  <text x="47" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="64" y="66" class="cap" fill="#4a90c2">CÔNG VĂN ĐẾN — từ bên thứ 3 (không công bố)</text>

  <!-- A1 Tiếp nhận (entry) -->
  <rect x="45" y="78" width="150" height="60" rx="9" fill="#fff8ec" stroke="#e08b1a" stroke-width="2"/>
  <text x="61" y="105" class="st" fill="#8a5a12">Tiếp nhận</text>
  <text x="61" y="124" class="en">Received</text>
  <!-- A2 Phân công -->
  <rect x="235" y="78" width="150" height="60" rx="9" fill="#eef5fb" stroke="#4a90c2"/>
  <text x="251" y="105" class="st" fill="#2f5f82">Phân công</text>
  <text x="251" y="124" class="en">Assigned</text>
  <!-- A3 Xử lý -->
  <rect x="425" y="78" width="150" height="60" rx="9" fill="#eef5fb" stroke="#4a90c2"/>
  <text x="441" y="105" class="st" fill="#2f5f82">Xử lý</text>
  <text x="441" y="124" class="en">In Process</text>
  <!-- A4 Hoàn thành -->
  <rect x="615" y="78" width="150" height="60" rx="9" fill="#edf9f0" stroke="#3d9a5c" stroke-width="2"/>
  <text x="631" y="105" class="st" fill="#256b40">Hoàn thành</text>
  <text x="631" y="124" class="en">Completed · khoá</text>
  <!-- A5 Lưu -->
  <rect x="805" y="78" width="150" height="60" rx="9" fill="#f4f6f8" stroke="#cbd2d9"/>
  <text x="821" y="105" class="st" fill="#5b6b78">Lưu trữ</text>
  <text x="821" y="124" class="en">Archived</text>

  <line x1="195" y1="108" x2="233" y2="108" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="385" y1="108" x2="423" y2="108" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="575" y1="108" x2="613" y2="108" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="765" y1="108" x2="803" y2="108" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="45" y="156" class="tag">Cấp số sổ đến ngay khi tiếp nhận — ví dụ CV-DEN-2026-0001</text>

  <!-- ================= NHÁNH B — ĐI / NỘI BỘ ================= -->
  <circle cx="47" cy="191" r="9" fill="#3d9a5c"/>
  <text x="47" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="64" y="196" class="cap" fill="#3d9a5c">CÔNG VĂN ĐI / VĂN BẢN NỘI BỘ — công ty ban hành</text>

  <!-- B1 Soạn -->
  <rect x="45" y="208" width="150" height="60" rx="9" fill="#fff8ec" stroke="#e08b1a" stroke-width="2"/>
  <text x="61" y="235" class="st" fill="#8a5a12">Soạn thảo</text>
  <text x="61" y="254" class="en">Draft</text>
  <!-- B2 Trình duyệt -->
  <rect x="235" y="208" width="150" height="60" rx="9" fill="#eef5fb" stroke="#4a90c2"/>
  <text x="251" y="235" class="st" fill="#2f5f82">Trình duyệt</text>
  <text x="251" y="254" class="en">Pending Approval</text>
  <!-- B3 Đã duyệt -->
  <rect x="425" y="208" width="150" height="60" rx="9" fill="#eef5fb" stroke="#4a90c2"/>
  <text x="441" y="235" class="st" fill="#2f5f82">Đã duyệt</text>
  <text x="441" y="254" class="en">Approved</text>
  <!-- B4 Ban hành (highlight) -->
  <rect x="615" y="208" width="150" height="60" rx="9" fill="#edf9f0" stroke="#3d9a5c" stroke-width="2.5"/>
  <text x="631" y="235" class="st" fill="#256b40">Ban hành</text>
  <text x="631" y="254" class="en">Issued · khoá</text>
  <!-- B5 Lưu -->
  <rect x="805" y="208" width="150" height="60" rx="9" fill="#f4f6f8" stroke="#cbd2d9"/>
  <text x="821" y="235" class="st" fill="#5b6b78">Lưu trữ</text>
  <text x="821" y="254" class="en">Archived</text>

  <line x1="195" y1="238" x2="233" y2="238" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="385" y1="238" x2="423" y2="238" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="575" y1="238" x2="613" y2="238" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="765" y1="238" x2="803" y2="238" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Rejected loop under Trình duyệt -->
  <rect x="235" y="288" width="150" height="38" rx="8" fill="#fdeeee" stroke="#d9534f"/>
  <text x="251" y="312" class="st" fill="#b23b3b" font-size="13">Trả lại · Rejected</text>
  <line x1="300" y1="268" x2="300" y2="286" stroke="#d9534f" stroke-width="1.5" marker-end="url(#arR)"/>
  <text x="308" y="282" class="tag" fill="#b23b3b">Reject</text>
  <path d="M 235 307 C 120 307 120 300 120 270" fill="none" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arR)"/>
  <text x="126" y="300" class="tag" fill="#b23b3b">Reopen: sửa lại</text>

  <!-- Arrow Ban hành -> Công bố band -->
  <line x1="690" y1="268" x2="690" y2="346" stroke="#8a63c9" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ================= CÔNG BỐ band ================= -->
  <rect x="40" y="348" width="915" height="208" rx="12" fill="#f7f4fc" stroke="#8a63c9" stroke-width="1.5"/>
  <text x="60" y="376" class="h" fill="#5b3aa0" font-size="15">CÔNG BỐ — tự động khi ban hành</text>
  <text x="60" y="396" class="s">bật/tắt từng kênh trong Settings  ·  phạm vi: Toàn công ty / Phòng ban / Nhân viên cụ thể</text>
  <text x="60" y="416" class="l">Cấp số hiệu chính thức (vd 04/2026/TB-TGĐG) + ngày hiệu lực · khoá văn bản · rồi gửi tới người nhận:</text>

  <!-- channel boxes -->
  <rect x="60" y="428" width="180" height="42" rx="8" fill="#eef5fb" stroke="#4a90c2"/>
  <text x="76" y="446" class="st" font-size="13" fill="#2f5f82">Thông báo hệ thống</text>
  <text x="76" y="463" class="en">chuông Desk / PWA</text>

  <rect x="256" y="428" width="120" height="42" rx="8" fill="#eef5fb" stroke="#4a90c2"/>
  <text x="272" y="446" class="st" font-size="13" fill="#2f5f82">Email</text>
  <text x="272" y="463" class="en">tới từng NV</text>

  <rect x="392" y="428" width="150" height="42" rx="8" fill="#f4f6f8" stroke="#cbd2d9" stroke-dasharray="4 3"/>
  <text x="408" y="446" class="st" font-size="13" fill="#8a94a0">PWA push</text>
  <text x="408" y="463" class="en">(giai đoạn sau)</text>

  <rect x="588" y="428" width="200" height="42" rx="8" fill="#fff8ec" stroke="#e08b1a"/>
  <text x="604" y="446" class="st" font-size="13" fill="#8a5a12">Sinh danh sách phải đọc</text>
  <text x="604" y="463" class="en">nếu bật "xác nhận đọc"</text>
  <line x1="542" y1="449" x2="586" y2="449" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- read row -->
  <rect x="60" y="496" width="330" height="42" rx="8" fill="#edf9f0" stroke="#3d9a5c"/>
  <text x="76" y="514" class="st" font-size="13" fill="#256b40">Nhân viên: mở VB, bấm "Đã đọc"</text>
  <text x="76" y="531" class="en">ghi lại thời điểm đọc</text>

  <rect x="430" y="496" width="358" height="42" rx="8" fill="#eef5fb" stroke="#4a90c2"/>
  <text x="446" y="514" class="st" font-size="13" fill="#2f5f82">Văn thư: theo dõi ai đã đọc / chưa đọc</text>
  <text x="446" y="531" class="en">danh sách Acknowledgment</text>
  <line x1="392" y1="517" x2="428" y2="517" stroke="#7b8794" stroke-width="1.6" marker-end="url(#ar)"/>
</svg>
