<style>
  /* Tăng cỡ chữ nội dung cho dễ đọc (just-the-docs mặc định hơi nhỏ). */
  .main-content { font-size: 1rem; line-height: 1.65; }
  .main-content p,
  .main-content li,
  .main-content td,
  .main-content th { font-size: 1rem; }
  .main-content h1 { font-size: 1.9rem; }
  .main-content h2 { font-size: 1.45rem; }
  .main-content h3 { font-size: 1.2rem; }
  /* Code/label inline rõ hơn */
  .main-content code { font-size: 0.92em; }
  /* Flowchart Mermaid: căn giữa + chữ to */
  .mermaid { text-align: center; }
  .mermaid svg { max-width: 100%; height: auto; }

  /* Ảnh click để phóng to (lightbox) */
  .main-content img { cursor: zoom-in; }
  #mw-lightbox {
    position: fixed; inset: 0; z-index: 9999; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(0, 0, 0, .85); cursor: zoom-out;
  }
  #mw-lightbox.open { display: flex; }
  #mw-lightbox img {
    max-width: 100%; max-height: 100%;
    border-radius: 6px; box-shadow: 0 6px 40px rgba(0, 0, 0, .6);
  }
  #mw-lightbox .mw-close {
    position: fixed; top: 12px; right: 20px; color: #fff;
    font-size: 32px; line-height: 1; opacity: .85;
  }
</style>
<script>
  /* Click ảnh trong nội dung → phóng to; click nền / nút × / phím ESC → đóng. */
  document.addEventListener('DOMContentLoaded', function () {
    var ov = document.createElement('div');
    ov.id = 'mw-lightbox';
    ov.innerHTML = '<span class="mw-close" aria-label="Đóng">×</span><img alt="">';
    document.body.appendChild(ov);
    var big = ov.querySelector('img');
    function close() { ov.classList.remove('open'); big.removeAttribute('src'); }
    ov.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    document.querySelectorAll('.main-content img').forEach(function (img) {
      img.addEventListener('click', function (e) {
        /* Ảnh thường được bọc trong thẻ <a> trỏ tới chính file gốc. Không chặn
           thì một cú bấm vừa mở lightbox vừa điều hướng sang file — người dùng
           thấy ảnh phóng to rồi trang nhảy đi mất. */
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) {
          return; /* Ctrl/Cmd/giữa chuột: để trình duyệt mở tab mới như thường */
        }
        e.preventDefault();
        big.src = img.currentSrc || img.src;
        ov.classList.add('open');
      });
    });
  });
</script>

</style>
<script>
  /* Nút "Xem toàn màn hình" cho sơ đồ quy trình (sơ đồ SVG nội tuyến nên không dùng được lightbox ảnh). */
  document.addEventListener('DOMContentLoaded', function () {
    var khoi = document.querySelectorAll('.qt-sodo');
    if (!khoi.length) return;
    var ov = document.createElement('div');
    ov.id = 'qt-toan-man';
    ov.innerHTML = '<span class="qt-goi-y">Cuộn để xem hết · bấm ô để mở · Esc để đóng</span>' +
                   '<span class="qt-dong" aria-label="Đóng">×</span><div class="qt-khung"></div>';
    document.body.appendChild(ov);
    var khung = ov.querySelector('.qt-khung');
    function dong() { ov.classList.remove('open'); khung.innerHTML = ''; document.body.style.overflow = ''; }
    ov.addEventListener('click', function (e) {
      if (e.target === ov || e.target.classList.contains('qt-dong')) { dong(); return; }
      /* Bấm liên kết trong sơ đồ: đóng lớp phủ trước để neo cùng trang còn cuộn tới được. */
      if (e.target.closest && e.target.closest('a')) { dong(); }
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ov.classList.contains('open')) dong(); });
    khoi.forEach(function (k) {
      var svg = k.querySelector('svg');
      if (!svg || k.classList.contains('qt-the-sd')) return;
      var nut = document.createElement('button');
      nut.type = 'button';
      nut.className = 'qt-nut-phong';
      nut.textContent = '⛶ Xem toàn màn hình';
      nut.addEventListener('click', function () {
        var ban = svg.cloneNode(true);
        ban.removeAttribute('aria-labelledby');
        ban.querySelectorAll('[id]').forEach(function (n) { if (n.tagName !== 'marker') n.removeAttribute('id'); });
        khung.innerHTML = '';
        khung.appendChild(ban);
        ov.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
      k.appendChild(nut);
    });
  });
</script>
